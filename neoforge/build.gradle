plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
        // Opens one of the mod's screens, saves a screenshot to run/screenshots and quits:
        // ./gradlew :neoforge:runUiTest -Puitest=shape -Puisize=1280x720   (shape, palette, undo)
        uiTest {
            client()
            systemProperty('effortlessbuilding.uitest', project.findProperty('uitest') ?: 'shape')
            systemProperty('effortlessbuilding.uitest.menu', project.findProperty('uimenu') ?: 'false')
            systemProperty('effortlessbuilding.uitest.scroll', project.findProperty('uiscroll') ?: 'false')
            def size = (project.findProperty('uisize') ?: '2000x1107').split('x')
            programArguments.addAll('--width', size[0], '--height', size[1])
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Required for compilation because common module source files are compiled here too.
    compileOnly("org.appliedenergistics:appliedenergistics2:${ae2_version}")
    compileOnly("io.wispforest:owo-lib-neoforge:${owo_neoforge_version}") { transitive = false }
    // Requires NeoForge 21.1.169
//    runtimeOnly("org.appliedenergistics:appliedenergistics2:${ae2_version}")
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}-fork"
}
