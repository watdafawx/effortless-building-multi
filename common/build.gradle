plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'

    // Applied Energistics 2 — optional integration for pulling building materials from ME network.
    // This is compileOnly so the JAR does not depend on AE2 at runtime.
    // Adjust the version to match the AE2 release for your target Minecraft version.
    // Available on Maven Central: https://central.sonatype.com/artifact/org.appliedenergistics/appliedenergistics2
    compileOnly("org.appliedenergistics:appliedenergistics2:${ae2_version}")

    // owo-ui for screens; each loader adds its own owo-lib build
    compileOnly("io.wispforest:owo-lib-neoforge:${owo_neoforge_version}") { transitive = false }

    // Unit tests for pure logic (shape generation) — no Minecraft classes on the test path
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Gson is bundled with Minecraft at runtime; tests need it directly
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

test {
    useJUnitPlatform()
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

